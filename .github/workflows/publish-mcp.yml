name: Publish Vultax to MCP Registry

on:
  workflow_dispatch:
    inputs:
      release:
        description: Registry metadata to publish
        required: true
        default: vi-assistant
        type: choice
        options:
          - vi-assistant
          - research-legacy

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out publication metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install verified MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish remote server metadata
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$RELEASE" = "research-legacy" ]; then
            ./mcp-publisher publish submission/server-1.0.0.json
          else
            ./mcp-publisher publish
          fi
